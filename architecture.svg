<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="c3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="400" fill="url(#bg)"/>

  <text x="480" y="48" text-anchor="middle" font-size="22" font-weight="bold" fill="#f8fafc">四层架构图 · 四层架构</text>
  <text x="480" y="72" text-anchor="middle" font-size="13" fill="#94a3b8">客户端 → API 网关 → 后端服务 → 数据库</text>

  <!-- 客户端 -->
  <g filter="url(#shadow)">
    <rect x="40" y="120" width="180" height="170" rx="14" fill="url(#c1)"/>
    <text x="130" y="180" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">📱 客户端</text>
    <text x="130" y="210" text-anchor="middle" font-size="12" fill="#e0f2fe">Web / App / 桌面端</text>
    <text x="130" y="235" text-anchor="middle" font-size="11" fill="#bae6fd">发起请求、渲染页面</text>
  </g>

  <!-- API 网关 -->
  <g filter="url(#shadow)">
    <rect x="280" y="120" width="180" height="170" rx="14" fill="url(#c2)"/>
    <text x="370" y="180" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">🚪 API 网关</text>
    <text x="370" y="210" text-anchor="middle" font-size="12" fill="#ede9fe">路由 / 鉴权 / 限流</text>
    <text x="370" y="235" text-anchor="middle" font-size="11" fill="#ddd6fe">统一入口，转发请求</text>
  </g>

  <!-- 后端服务 -->
  <g filter="url(#shadow)">
    <rect x="520" y="120" width="180" height="170" rx="14" fill="url(#c3)"/>
    <text x="610" y="180" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">⚙️ 后端服务</text>
    <text x="610" y="210" text-anchor="middle" font-size="12" fill="#d1fae5">业务逻辑 / 微服务</text>
    <text x="610" y="235" text-anchor="middle" font-size="11" fill="#a7f3d0">处理业务、调用数据</text>
  </g>

  <!-- 数据库 -->
  <g filter="url(#shadow)">
    <rect x="760" y="120" width="180" height="170" rx="14" fill="url(#c4)"/>
    <text x="850" y="180" text-anchor="middle" font-size="20" font-weight="bold" fill="#fff">🗄️ 数据库</text>
    <text x="850" y="210" text-anchor="middle" font-size="12" fill="#fef3c7">MySQL / Redis / PG</text>
    <text x="850" y="235" text-anchor="middle" font-size="11" fill="#fde68a">持久化存储数据</text>
  </g>

  <!-- 箭头 -->
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
        <path d="M0,0 L8,3 L0,6 z" fill="#38bdf8"/>
      </marker>
    </defs>
    <line x1="222" y1="205" x2="276" y2="205"/>
    <line x1="462" y1="205" x2="516" y2="205"/>
    <line x1="702" y1="205" x2="756" y2="205"/>
  </g>

  <!-- 底层标签 -->
  <g font-size="12" fill="#94a3b8">
    <text x="130" y="330" text-anchor="middle">HTTPS/HTTP</text>
    <text x="370" y="330" text-anchor="middle">REST / gRPC</text>
    <text x="610" y="330" text-anchor="middle">ORM / SQL</text>
    <text x="850" y="330" text-anchor="middle">数据落盘</text>
  </g>
</svg>
