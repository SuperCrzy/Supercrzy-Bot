<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a14">
<title>SUPERCRZY · 登录</title>
<style>
  :root {
    --bg: #0a0a14;
    --bg-soft: #12121e;
    --card: rgba(255, 255, 255, 0.03);
    --stroke: rgba(255, 255, 255, 0.08);
    --text: #fafafa;
    --text-dim: #8a8a9a;
    --brand-1: #6366f1;   /* indigo */
    --brand-2: #8b5cf6;   /* violet */
    --brand-3: #3b82f6;   /* blue */
    --danger: #f87171;
    --radius: 18px;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ 氛围光背景（漂浮呼吸） ============ */
  .glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.55;
    pointer-events: none;
    z-index: 0;
  }
  .glow-a {
    width: 340px; height: 340px;
    background: rgba(99, 102, 241, 0.30);   /* indigo */
    top: -140px; right: -100px;
    animation: drift-a 13s ease-in-out infinite alternate, breathe 7s ease-in-out infinite alternate;
  }
  .glow-b {
    width: 300px; height: 300px;
    background: rgba(139, 92, 246, 0.18);   /* violet */
    bottom: -120px; left: -80px;
    animation: drift-b 15s ease-in-out infinite alternate, breathe 9s ease-in-out infinite alternate-reverse;
  }
  .glow-c {
    width: 220px; height: 220px;
    background: rgba(59, 130, 246, 0.14);   /* blue */
    top: 38%; left: -90px;
    animation: drift-c 17s ease-in-out infinite alternate, breathe 11s ease-in-out infinite alternate-reverse;
  }
  @keyframes drift-a {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(-46px, 34px) scale(1.18); }
  }
  @keyframes drift-b {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(38px, -28px) scale(1.14); }
  }
  @keyframes drift-c {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(52px, 40px) scale(1.2); }
  }
  @keyframes breathe {
    from { opacity: 0.38; }
    to   { opacity: 0.62; }
  }

  /* ---- 噪点质感 ---- */
  .noise {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.35;
    background-image: radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 3px 3px;
  }

  /* ---- 网格线（科技感） ---- */
  .grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.22;
    background-image:
      linear-gradient(rgba(99, 102, 241, 0.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99, 102, 241, 0.10) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 30%, #000 30%, transparent 75%);
            mask-image: radial-gradient(ellipse 90% 70% at 50% 30%, #000 30%, transparent 75%);
  }

  .page {
    position: relative; z-index: 1;
    width: 100%; max-width: 460px;
    min-height: 100dvh;
    padding: calc(env(safe-area-inset-top) + 64px) 32px calc(env(safe-area-inset-bottom) + 32px);
    display: flex; flex-direction: column;
  }

  /* ============ 顶部品牌（logo 渐变流动 + 脉动） ============ */
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 56px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, var(--brand-1), var(--brand-2), var(--brand-3), var(--brand-1));
    background-size: 300% 300%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
    animation: gradient-flow 6s ease infinite, mark-pulse 3s ease-in-out infinite;
  }
  @keyframes gradient-flow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes mark-pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.36); }
    50%      { transform: scale(1.05); box-shadow: 0 8px 30px rgba(139, 92, 246, 0.55); }
  }
  .brand-mark svg { width: 18px; height: 18px; }
  .brand-name { font-size: 15px; font-weight: 700; letter-spacing: 0.06em; }
  .brand-name span { color: var(--text-dim); font-weight: 500; }

  /* ============ 标题 ============ */
  .headline h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 10px; }
  .headline p { font-size: 14px; color: var(--text-dim); line-height: 1.6; }

  /* ============ 表单 ============ */
  .form { margin-top: 44px; display: flex; flex-direction: column; gap: 28px; }

  .field { position: relative; }
  .field label {
    display: block; font-size: 12px; font-weight: 600; color: var(--text-dim);
    letter-spacing: 0.08em; margin-bottom: 12px; text-transform: uppercase;
    transition: color 0.35s var(--ease-out);
  }
  .field:focus-within label { color: var(--brand-2); }

  .field input {
    width: 100%; background: transparent; border: none; outline: none;
    font-size: 17px; color: var(--text); padding: 8px 40px 10px 0;
    border-bottom: 1px solid var(--stroke);
    transition: border-color 0.3s;
    caret-color: var(--brand-2);
    font-family: inherit;
  }
  .field input::placeholder { color: #4a4a58; }
  .field input:focus { border-bottom-color: transparent; }
  .field .line {
    position: absolute; left: 0; bottom: 0; height: 1.5px; width: 100%;
    background: linear-gradient(90deg, var(--brand-1), var(--brand-2), var(--brand-3));
    transform: scaleX(0); transform-origin: left;
    transition: transform 0.45s var(--ease-out);
  }
  .field input:focus ~ .line { transform: scaleX(1); }

  /* 聚焦时光斑扩散 */
  .field .focus-halo {
    position: absolute; left: 0; bottom: -1px; width: 100%; height: 3px;
    background: radial-gradient(50% 100% at 50% 100%, rgba(139, 92, 246, 0.42), transparent);
    opacity: 0; transform: scaleX(0.4);
    transition: opacity 0.5s var(--ease-out), transform 0.5s var(--ease-out);
    pointer-events: none;
  }
  .field:focus-within .focus-halo { opacity: 1; transform: scaleX(1); }

  /* 校验失败抖动 */
  .field.error input { border-bottom-color: var(--danger); }
  .field.error .line { background: linear-gradient(90deg, var(--danger), #fb923c); transform: scaleX(1); }
  .field.error label { color: var(--danger); }
  .shake { animation: shake 0.45s var(--ease-out); }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(3px); }
  }

  .field .icon {
    position: absolute; right: 0; bottom: 10px;
    width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
  }
  .field .icon svg { width: 20px; height: 20px; stroke: var(--text-dim); }
  .field .icon.eye { cursor: pointer; perspective: 200px; }
  .field .icon.eye svg { position: absolute; backface-visibility: hidden; transition: transform 0.4s var(--ease-spring), opacity 0.25s; }
  .field .icon.eye .eye-front { transform: rotateY(0); }
  .field .icon.eye .eye-back  { transform: rotateY(180deg); opacity: 0; }
  .field .icon.eye.flipped .eye-front { transform: rotateY(-180deg); opacity: 0; }
  .field .icon.eye.flipped .eye-back  { transform: rotateY(0); opacity: 1; }
  .field .icon.eye:active { opacity: 0.6; }

  /* ============ 行内操作 ============ */
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim); cursor: pointer; user-select: none; }
  .check input { display: none; }
  .check .box {
    width: 16px; height: 16px; border-radius: 5px; border: 1px solid var(--stroke);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s var(--ease-spring);
  }
  .check .box svg { width: 10px; height: 10px; stroke: #fff; opacity: 0; transform: scale(0.3) rotate(-20deg); transition: all 0.25s var(--ease-spring); }
  .check input:checked + .box { background: linear-gradient(135deg, var(--brand-1), var(--brand-2)); border-color: transparent; transform: scale(1.08); }
  .check input:checked + .box svg { opacity: 1; transform: scale(1) rotate(0); }
  .check:active .box { transform: scale(0.92); }
  .link { font-size: 13px; color: var(--brand-2); text-decoration: none; font-weight: 500; }

  /* ============ 主按钮（ripple + loading + 成功） ============ */
  .btn-login {
    margin-top: 36px; width: 100%; height: 54px; border: none; border-radius: 16px;
    background: linear-gradient(135deg, var(--brand-1), var(--brand-2));
    color: #fff; font-size: 16px; font-weight: 700; letter-spacing: 0.04em;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 10px 30px rgba(99, 102, 241, 0.35);
    transition: transform 0.15s ease, box-shadow 0.3s ease, filter 0.3s ease;
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn-login:active { transform: scale(0.97); box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3); }
  .btn-login:disabled { cursor: default; filter: saturate(0.7) brightness(0.9); }
  .btn-login.success { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; }
  .btn-login.success:disabled { filter: none; }

  .btn-login .shine {
    position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.3), transparent);
    transform: skewX(-20deg); animation: shine 3.2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes shine { 0%, 55% { left: -60%; } 85%, 100% { left: 130%; } }

  /* 点击波纹 */
  .ripple {
    position: absolute; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 70%);
    transform: scale(0);
    animation: ripple 0.6s var(--ease-out) forwards;
  }
  @keyframes ripple { to { transform: scale(4); opacity: 0; } }

  /* loading 三点 */
  .dots span {
    display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: currentColor; margin: 0 2px;
    animation: dot-bounce 1s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes dot-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
    40% { transform: translateY(-5px); opacity: 1; }
  }

  /* 成功光环扩散 */
  .btn-login .success-ring {
    position: absolute; inset: 0; border-radius: 16px; pointer-events: none;
    border: 2px solid rgba(34, 197, 94, 0.9);
    transform: scale(0.96); opacity: 0;
    animation: ring-pop 0.6s var(--ease-out) forwards;
  }
  @keyframes ring-pop {
    to { transform: scale(1.06); opacity: 1; }
  }

  /* ============ 分割线与第三方登录 ============ */
  .divider {
    display: flex; align-items: center; gap: 14px;
    margin-top: 34px; font-size: 12px; color: var(--text-dim); letter-spacing: 0.08em;
  }
  .divider::before, .divider::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--stroke), transparent);
  }

  .socials { display: flex; justify-content: center; gap: 26px; margin-top: 26px; }
  .social {
    width: 48px; height: 48px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--stroke);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); cursor: pointer;
    transition: transform 0.3s var(--ease-spring), border-color 0.3s, color 0.3s, box-shadow 0.3s;
    animation: social-float 3.4s ease-in-out infinite;
  }
  .social:nth-child(2) { animation-delay: 0.8s; }
  .social svg { width: 22px; height: 22px; }
  .social:hover { color: var(--text); border-color: rgba(139, 92, 246, 0.5); box-shadow: 0 8px 24px rgba(99, 102, 241, 0.25); }
  .social:active { transform: scale(0.9); animation: none; }
  @keyframes social-float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }

  .footer { margin-top: 34px; text-align: center; font-size: 13px; color: var(--text-dim); }
  .footer a { color: var(--brand-2); text-decoration: none; font-weight: 600; }

  /* ============ Toast ============ */
  .toast {
    position: fixed; top: calc(env(safe-area-inset-top) + 18px); left: 50%;
    transform: translate(-50%, -90px);
    display: flex; align-items: center; gap: 8px;
    background: rgba(20, 20, 34, 0.92); border: 1px solid var(--stroke);
    border-radius: 12px; padding: 12px 18px;
    font-size: 13px; color: var(--text);
    box-shadow: 0 16px 44px rgba(0, 0, 0, 0.5);
    transition: transform 0.45s var(--ease-spring), opacity 0.3s;
    opacity: 0; z-index: 99; pointer-events: none;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  .toast-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand-2); flex-shrink: 0; }
  .toast.success .toast-dot { background: #22c55e; }
  .toast.error .toast-dot { background: #f87171; }

  /* ============ 入场动画 ============ */
  .brand, .headline, .field, .row, .btn-login, .divider, .socials, .footer {
    opacity: 0;
    animation: rise-in 0.7s var(--ease-out) forwards;
  }
  .brand    { animation-delay: 0.05s; }
  .headline { animation-delay: 0.15s; }
  .field:nth-of-type(1) { animation-delay: 0.25s; }
  .field:nth-of-type(2) { animation-delay: 0.33s; }
  .row      { animation-delay: 0.42s; }
  .btn-login{ animation-delay: 0.5s; }
  .divider  { animation-delay: 0.58s; }
  .socials  { animation-delay: 0.66s; }
  .footer   { animation-delay: 0.74s; }
  @keyframes rise-in {
    from { opacity: 0; transform: translateY(18px); filter: blur(4px); }
    to   { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  /* ============ 无障碍：系统减弱动态时关闭动画 ============ */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .brand, .headline, .field, .row, .btn-login, .divider, .socials, .footer { opacity: 1; }
  }
</style>
</head>
<body>

  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>
  <div class="glow glow-c"></div>
  <div class="grid"></div>
  <div class="noise"></div>

  <main class="page">

    <header class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v3M5.6 5.6l2.1 2.1M3 12h3M18.4 5.6l-2.1 2.1M21 12h-3M12 21v-3M7.7 7.7l-1.5-1.5M16.3 7.7l1.5-1.5M7.7 16.3l-1.5 1.5M16.3 16.3l1.5 1.5"/>
        </svg>
      </div>
      <div class="brand-name">SUPERCRZY <span>· 登录</span></div>
    </header>

    <section class="headline">
      <h1>欢迎回来</h1>
      <p>登录以继续使用你的智能工作台</p>
    </section>

    <form class="form" id="loginForm" novalidate>

      <div class="field" id="fieldAccount">
        <label for="account">账号</label>
        <input id="account" type="text" placeholder="邮箱 / 手机号" autocomplete="username" required>
        <span class="line"></span>
        <span class="focus-halo"></span>
      </div>

      <div class="field" id="fieldPassword">
        <label for="password">密码</label>
        <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password" required>
        <span class="line"></span>
        <span class="focus-halo"></span>
        <span class="icon eye" id="eyeToggle">
          <svg class="eye-front" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/>
          </svg>
          <svg class="eye-back" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3l18 18"/><path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 4.6-1.1"/>
          </svg>
        </span>
      </div>

      <div class="row">
        <label class="check">
          <input type="checkbox" id="remember">
          <span class="box"><svg viewBox="0 0 24 24" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.5 5 5 10-11"/></svg></span>
          记住我
        </label>
        <a class="link" href="javascript:void(0)">忘记密码？</a>
      </div>

      <button class="btn-login" type="submit" id="btnLogin">
        <span class="shine"></span>
        <span class="btn-text">登 录</span>
      </button>

      <div class="divider">其他方式</div>
      <div class="socials">
        <div class="social" title="微信登录">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.1 4.6C5.6 4.6 2.7 6.9 2.7 9.8c0 1.6.9 3 2.3 4l-.6 1.8 2-1c.6.2 1.2.3 1.9.4h.5c-.1-.4-.1-.8-.1-1.2 0-2.9 2.8-5.2 6.2-5.2h.3c-.4-2.7-3.5-5-7.1-5zm-1.9 3.7a.8.8 0 1 1 0-1.7.8.8 0 0 1 0 1.7zm5.2 0a.8.8 0 1 1 0-1.7.8.8 0 0 1 0 1.7zM21.3 14.9c0-2.5-2.5-4.5-5.5-4.5s-5.5 2-5.5 4.5 2.5 4.5 5.5 4.5c.6 0 1.2-.1 1.8-.3l1.7.9-.5-1.5c1.5-.8 2.5-2 2.5-3.6zm-7.4-1.5a.7.7 0 1 1 0-1.4.7.7 0 0 1 0 1.4zm4.1 0a.7.7 0 1 1 0-1.4.7.7 0 0 1 0 1.4z"/></svg>
        </div>
        <div class="social" title="Apple 登录">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.9c0-2.2 1.8-3.3 1.9-3.3-1-1.5-2.6-1.7-3.2-1.7-1.3-.1-2.6.8-3.3.8-.7 0-1.7-.8-2.9-.7-1.5 0-2.8.9-3.6 2.2-1.5 2.7-.4 6.6 1.1 8.7.7 1.1 1.6 2.3 2.8 2.2 1.1 0 1.5-.7 2.9-.7s1.7.7 2.9.7c1.2 0 2-1.1 2.7-2.2.9-1.2 1.2-2.4 1.2-2.5-.1 0-2.4-.9-2.5-3.5zm-2.3-6.9c.6-.7 1-1.7.9-2.7-.9 0-1.9.6-2.5 1.3-.5.6-1 1.6-.9 2.6 1 .1 2-.5 2.5-1.2z"/></svg>
        </div>
      </div>

      <p class="footer">还没有账号？<a href="javascript:void(0)">立即注册</a></p>
    </form>

  </main>

  <div class="toast" id="toast"><span class="toast-dot"></span><span class="toast-text"></span></div>

<script>
  const $ = (id) => document.getElementById(id);
  const pwd = $('password');
  const eye = $('eyeToggle');

  /* ---- 密码可见切换（3D 翻转） ---- */
  eye.addEventListener('click', () => {
    const show = pwd.type === 'password';
    pwd.type = show ? 'text' : 'password';
    eye.classList.toggle('flipped', show);
  });

  /* ---- 按钮点击波纹 ---- */
  const btn = $('btnLogin');
  btn.addEventListener('pointerdown', (e) => {
    const rect = btn.getBoundingClientRect();
    const r = document.createElement('span');
    r.className = 'ripple';
    const size = Math.max(rect.width, rect.height);
    r.style.width = r.style.height = size + 'px';
    r.style.left = (e.clientX - rect.left - size / 2) + 'px';
    r.style.top  = (e.clientY - rect.top - size / 2) + 'px';
    btn.appendChild(r);
    r.addEventListener('animationend', () => r.remove());
  });

  /* ---- Toast ---- */
  let toastTimer;
  function toast(msg, type = '') {
    const t = $('toast');
    t.className = 'toast show ' + type;
    t.querySelector('.toast-text').textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
  }

  /* ---- 校验失败：抖动 + 红色提示 ---- */
  function markError(field) {
    field.classList.add('error', 'shake');
    setTimeout(() => field.classList.remove('shake'), 500);
    field.addEventListener('input', () => field.classList.remove('error'), { once: true });
  }

  /* ---- 登录：loading → 成功 ---- */
  $('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const account = $('account').value.trim();
    const password = pwd.value.trim();
    const fA = $('fieldAccount'), fP = $('fieldPassword');
    let ok = true;

    if (!account) { markError(fA); ok = false; }
    if (!password) { markError(fP); ok = false; }
    if (!ok) { toast('请填写账号和密码', 'error'); return; }

    // —— 演示：此处接入你的真实登录接口 ——
    btn.disabled = true;
    btn.classList.remove('success');
    btn.querySelector('.btn-text').innerHTML =
      '<span class="dots"><span></span><span></span><span></span></span>';

    setTimeout(() => {
      btn.classList.add('success');
      btn.querySelector('.btn-text').textContent = '✓ 登录成功';
      toast('欢迎回来，' + account, 'success');
      setTimeout(() => {
        btn.classList.remove('success');
        btn.querySelector('.btn-text').textContent = '登 录';
        btn.disabled = false;
      }, 2000);
    }, 1300);
  });
</script>
</body>
</html>
