<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MKT 工作流动画演示</title>
<link rel="stylesheet" href="mkt-flow.css"/>
</head>
<body>
<div class="page">
  <header>
    <h1>市场营销（MKT）工作流程图 · 动画演示</h1>
    <p class="sub">含决策分支与阶段泳道 · 每 1 秒推进一个环节 · 自动播放</p>
    <div class="phase-bar">
      <span class="phase p1" id="ph1">📋 策划期</span>
      <span class="phase p2" id="ph2">🚀 执行期</span>
      <span class="phase p3" id="ph3">🔍 复盘期</span>
    </div>
  </header>

  <div class="progress"><div class="progress-bar" id="pbar"></div></div>

  <div class="svg-card">
    <svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6366f1"/>
        </linearGradient>
        <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#3b82f6"/>
        </linearGradient>
        <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#f97316"/>
        </linearGradient>
      </defs>

      <!-- 标题 -->
      <text x="340" y="28" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">市场营销（MKT）工作流程图 · 优化版</text>
      <text x="340" y="50" text-anchor="middle" font-size="12.5" fill="#64748b">含决策分支与阶段泳道，贴近真实 MKT 工作流</text>

      <!-- 泳道背景 -->
      <rect class="lane" style="--d:.1s" x="10" y="62" width="660" height="92" rx="10" fill="#f5f3ff"/>
      <rect class="lane" style="--d:.1s" x="10" y="62" width="6" height="92" rx="3" fill="#8b5cf6" opacity="0.7"/>
      <text class="lane" style="--d:.1s" x="40" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c3aed" transform="rotate(-90 40 108)" letter-spacing="4">策划期</text>
      <rect class="lane" style="--d:4.1s" x="10" y="160" width="660" height="92" rx="10" fill="#eff6ff"/>
      <rect class="lane" style="--d:4.1s" x="10" y="160" width="6" height="92" rx="3" fill="#3b82f6" opacity="0.7"/>
      <text class="lane" style="--d:4.1s" x="40" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb" transform="rotate(-90 40 206)" letter-spacing="4">执行期</text>
      <rect class="lane" style="--d:8.6s" x="10" y="258" width="660" height="92" rx="10" fill="#fffbeb"/>
      <rect class="lane" style="--d:8.6s" x="10" y="258" width="6" height="92" rx="3" fill="#f59e0b" opacity="0.7"/>
      <text class="lane" style="--d:8.6s" x="40" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#d97706" transform="rotate(-90 40 304)" letter-spacing="4">复盘期</text>

      <!-- 行1 -->
      <rect class="nd" style="--d:1s" x="44" y="76" width="76" height="64" rx="32" fill="#10b981"/>
      <text class="nd" style="--d:1.15s" x="82" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">开始</text>

      <rect class="nd" style="--d:2s" x="140" y="76" width="132" height="64" rx="10" fill="url(#g1)"/>
      <text class="nd" style="--d:2.15s" x="206" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">① 市场调研</text>
      <text class="nd" style="--d:2.3s" x="206" y="124" text-anchor="middle" font-size="10.5" fill="#ede9fe">用户洞察 · 竞品分析</text>

      <rect class="nd" style="--d:3s" x="292" y="76" width="132" height="64" rx="10" fill="url(#g1)"/>
      <text class="nd" style="--d:3.15s" x="358" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">② 策略制定</text>
      <text class="nd" style="--d:3.3s" x="358" y="124" text-anchor="middle" font-size="10.5" fill="#ede9fe">定目标 · 预算 · 打法</text>

      <g class="dc-outer" style="--d:4.1s">
        <polygon points="466,108 508,81 550,108 508,135" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5"/>
      </g>
      <text class="dc-inner lbl" style="--d:4.1s" x="508" y="105" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#78350f">预算</text>
      <text class="dc-inner lbl" style="--d:4.1s" x="508" y="121" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#78350f">审批？</text>

      <!-- 行1 箭头 -->
      <line class="ln" style="--d:1.6s" x1="120" y1="108" x2="138" y2="108" stroke="#6366f1" stroke-width="2.5"/>
      <path class="tip" style="--d:1.6s" d="M 138 108 l -7 -4 v 8 z" fill="#6366f1"/>
      <line class="ln" style="--d:2.6s" x1="272" y1="108" x2="290" y2="108" stroke="#6366f1" stroke-width="2.5"/>
      <path class="tip" style="--d:2.6s" d="M 290 108 l -7 -4 v 8 z" fill="#6366f1"/>
      <line class="ln" style="--d:3.6s" x1="424" y1="108" x2="464" y2="108" stroke="#6366f1" stroke-width="2.5"/>
      <path class="tip" style="--d:3.6s" d="M 464 108 l -7 -4 v 8 z" fill="#6366f1"/>

      <!-- 审批通过 → 下行 -->
      <path class="ln" style="--d:4.6s" d="M 508 135 L 508 154 L 110 154 L 110 170" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
      <path class="tip" style="--d:4.6s" d="M 110 170 l 4 -7 h -8 z" fill="#3b82f6"/>
      <text class="lbl" style="--d:4.6s" x="470" y="148" font-size="11" font-weight="bold" fill="#2563eb">通过</text>

      <!-- 审批不通过 → 回 ②（分支1） -->
      <path class="branch" style="--d:12s" d="M 472 98 H 372" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-dasharray="6 4"/>
      <path class="branch" style="--d:12.45s" d="M 372 98 l 7 -4 v 8 z" fill="#f59e0b"/>
      <text class="branch" style="--d:12.45s" x="432" y="90" font-size="10.5" font-weight="bold" fill="#d97706">不通过</text>

      <!-- 行2 -->
      <rect class="nd" style="--d:5.6s" x="44" y="174" width="132" height="64" rx="10" fill="url(#g2)"/>
      <text class="nd" style="--d:5.75s" x="110" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">③ 计划排期</text>
      <text class="nd" style="--d:5.9s" x="110" y="222" text-anchor="middle" font-size="10.5" fill="#e0f2fe">选渠道 · 内容排期</text>

      <rect class="nd" style="--d:6.6s" x="204" y="174" width="132" height="64" rx="10" fill="url(#g2)"/>
      <text class="nd" style="--d:6.75s" x="270" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">④ 执行落地</text>
      <text class="nd" style="--d:6.9s" x="270" y="222" text-anchor="middle" font-size="10.5" fill="#e0f2fe">内容投放 · 活动</text>

      <rect class="nd" style="--d:7.6s" x="364" y="174" width="132" height="64" rx="10" fill="url(#g2)"/>
      <text class="nd" style="--d:7.75s" x="430" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">⑤ 数据监测</text>
      <text class="nd" style="--d:7.9s" x="430" y="222" text-anchor="middle" font-size="10.5" fill="#e0f2fe">效果追踪 · 分析</text>

      <g class="dc-outer" style="--d:8.7s">
        <polygon points="524,206 566,179 608,206 566,233" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5"/>
      </g>
      <text class="dc-inner lbl" style="--d:8.7s" x="566" y="202" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#78350f">效果</text>
      <text class="dc-inner lbl" style="--d:8.7s" x="566" y="219" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#78350f">达标？</text>

      <!-- 行2 箭头 -->
      <line class="ln" style="--d:5.1s" x1="176" y1="206" x2="202" y2="206" stroke="#3b82f6" stroke-width="2.5"/>
      <path class="tip" style="--d:5.1s" d="M 202 206 l -7 -4 v 8 z" fill="#3b82f6"/>
      <line class="ln" style="--d:6.1s" x1="336" y1="206" x2="362" y2="206" stroke="#3b82f6" stroke-width="2.5"/>
      <path class="tip" style="--d:6.1s" d="M 362 206 l -7 -4 v 8 z" fill="#3b82f6"/>
      <line class="ln" style="--d:7.1s" x1="496" y1="206" x2="522" y2="206" stroke="#3b82f6" stroke-width="2.5"/>
      <path class="tip" style="--d:7.1s" d="M 522 206 l -7 -4 v 8 z" fill="#3b82f6"/>

      <!-- 达标 → 下行 ⑥ -->
      <path class="ln" style="--d:9.3s" d="M 566 233 L 566 252 L 206 252 L 206 268" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
      <path class="tip" style="--d:9.3s" d="M 206 268 l 4 -7 h -8 z" fill="#f59e0b"/>
      <text class="lbl" style="--d:9.3s" x="470" y="246" font-size="11" font-weight="bold" fill="#059669">达标</text>

      <!-- 不达标 → 绕行回 ④（分支2） -->
      <path class="branch" style="--d:12.9s" d="M 608 206 H 638 V 152 H 270 V 170" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-dasharray="6 4"/>
      <path class="branch" style="--d:13.5s" d="M 270 170 l 4 -7 h -8 z" fill="#f59e0b"/>
      <text class="branch" style="--d:13.5s" x="566" y="144" font-size="10.5" font-weight="bold" fill="#d97706">不达标 · 应急调整</text>

      <!-- 行3 -->
      <rect class="nd" style="--d:10.3s" x="140" y="272" width="132" height="64" rx="10" fill="url(#g3)"/>
      <text class="nd" style="--d:10.45s" x="206" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">⑥ 复盘优化</text>
      <text class="nd" style="--d:10.6s" x="206" y="320" text-anchor="middle" font-size="10.5" fill="#fef3c7">ROI 评估 · 迭代策略</text>

      <rect class="nd" style="--d:11.3s" x="300" y="272" width="76" height="64" rx="32" fill="#059669"/>
      <text class="nd" style="--d:11.45s" x="338" y="312" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">结束</text>

      <line class="ln" style="--d:10.8s" x1="272" y1="304" x2="298" y2="304" stroke="#f97316" stroke-width="2.5"/>
      <path class="tip" style="--d:10.8s" d="M 298 304 l -7 -4 v 8 z" fill="#f97316"/>

      <!-- 大反馈回路：⑥ → ② 持续优化 -->
      <path class="loopln" style="--d:13.8s" d="M 140 304 L 20 304 L 20 73 L 356 73" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
      <circle class="dot" style="--d:13.8s" r="4" fill="#fbbf24">
        <animateMotion dur="2.2s" repeatCount="indefinite" begin="0s"
          path="M 140 304 L 20 304 L 20 73 L 356 73"/>
      </circle>
      <text class="branch" style="--d:14.3s" x="14" y="190" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#d97706" transform="rotate(-90 14 190)">持续优化 · 复盘反馈</text>

      <!-- 图例 -->
      <line x1="60" y1="372" x2="88" y2="372" stroke="#3b82f6" stroke-width="2.5"/>
      <path d="M 88 372 l -7 -4 v 8 z" fill="#3b82f6"/>
      <text x="96" y="376" font-size="11" fill="#475569">主流程</text>
      <line x1="190" y1="372" x2="218" y2="372" stroke="#f59e0b" stroke-width="2.2" stroke-dasharray="6 4"/>
      <path d="M 218 372 l -7 -4 v 8 z" fill="#f59e0b"/>
      <text x="226" y="376" font-size="11" fill="#475569">分支 / 反馈回路</text>
      <polygon points="336,364 344,372 336,380 328,372" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="354" y="376" font-size="11" fill="#475569">决策点</text>
      <rect x="438" y="365" width="50" height="14" rx="7" fill="#10b981"/>
      <text x="463" y="375" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">起止</text>

      <text x="340" y="400" text-anchor="middle" font-size="10.5" fill="#94a3b8">决策不通过 / 不达标 → 就近返回对应环节，形成快速调整闭环</text>
    </svg>
  </div>

  <div class="panel">
    <div class="step-box" id="stepBox">🎬 MKT 工作流动画即将开始…</div>
    <div class="controls">
      <button id="btnPlay">⏸ 暂停</button>
      <button id="btnReplay">↻ 重播</button>
    </div>
  </div>

  <footer class="legend">
    <span><i class="solid"></i>主流程</span>
    <span><i class="dash"></i>分支 / 反馈</span>
    <span><span class="diamond"></span>决策点</span>
    <span><span class="pill"></span>起止节点</span>
  </footer>
</div>
<script src="mkt-flow.js"></script>
</body>
</html>
