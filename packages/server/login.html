<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPERCRZY BOT · 登录</title>
<style>
/* ========== 全局重置与主题变量 ========== */
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg1:#1a1033;--bg2:#2d1b4e;--accent:#a855f7;--accent2:#ec4899;
--text:#f3f4f6;--muted:#9ca3af;--card:rgba(255,255,255,.06);
--border:rgba(255,255,255,.12);--input:rgba(255,255,255,.08);
--ok:#34d399;--err:#f87171;--warn:#fbbf24;--shadow:0 20px 60px rgba(0,0,0,.45)}
html,body{height:100%}

/* ========== 页面背景 ========== */
body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
background:linear-gradient(135deg,var(--bg1),var(--bg2) 50%,#3b1a5e);
background-attachment:fixed;color:var(--text);
display:flex;align-items:center;justify-content:center;
min-height:100vh;padding:20px;position:relative;overflow-x:hidden}
/* 径向光斑装饰 */
body::before{
content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
background:
radial-gradient(circle at 15% 20%,rgba(168,85,247,.35),transparent 45%),
radial-gradient(circle at 85% 80%,rgba(236,72,153,.3),transparent 45%),
radial-gradient(circle at 70% 15%,rgba(59,130,246,.2),transparent 40%)}
#particles{position:fixed;inset:0;z-index:1;pointer-events:none}

/* ========== 登录卡片 ========== */
.login-card{
position:relative;z-index:2;width:100%;max-width:400px;
background:var(--card);border:1px solid var(--border);border-radius:16px;
padding:40px 36px 32px;box-shadow:var(--shadow);
backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
animation:cardIn .6s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}

/* ========== 品牌区 ========== */
.brand{text-align:center;margin-bottom:28px}
.logo{
width:64px;height:64px;margin:0 auto 14px;border-radius:18px;
background:linear-gradient(135deg,#f59e0b,#f97316 55%,#ef4444);
display:flex;align-items:center;justify-content:center;
font-size:30px;font-weight:800;color:#fff;
box-shadow:0 8px 24px rgba(249,115,22,.4)}
.brand h1{font-size:22px;font-weight:700;letter-spacing:.5px}
.brand p{color:var(--muted);font-size:13px;margin-top:6px}

/* ========== 表单字段 ========== */
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px;font-weight:500}
.input-wrap{position:relative}
.input-wrap input{
width:100%;padding:12px 44px 12px 40px;background:var(--input);
border:1px solid var(--border);border-radius:10px;color:var(--text);
font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
.input-wrap input::placeholder{color:rgba(156,163,175,.6)}
.input-wrap input:hover{border-color:rgba(168,85,247,.45)}
.input-wrap input:focus{
border-color:var(--accent);background:rgba(168,85,247,.1);
box-shadow:0 0 0 3px rgba(168,85,247,.22)}
/* 输入框左侧图标 */
.input-wrap .icon{
position:absolute;left:13px;top:50%;transform:translateY(-50%);
font-size:15px;opacity:.6;pointer-events:none}
/* 密码显隐按钮 */
.toggle-pw{
position:absolute;right:10px;top:50%;transform:translateY(-50%);
background:none;border:none;color:var(--muted);font-size:15px;
cursor:pointer;padding:4px;transition:color .2s}
.toggle-pw:hover{color:var(--text)}

/* ========== 密码强度条 ========== */
.strength{
display:none;margin-top:8px;height:4px;border-radius:2px;
background:rgba(255,255,255,.1);overflow:hidden}
.strength.show{display:block}
.strength i{
display:block;height:100%;width:0;border-radius:2px;
background:var(--err);transition:width .3s ease,background .3s}
.strength-tip{display:none;font-size:11px;color:var(--muted);margin-top:5px}
.strength-tip.show{display:block}

/* ========== 选项行 ========== */
.options{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;font-size:13px}
.remember{display:flex;align-items:center;gap:7px;color:var(--muted);cursor:pointer;user-select:none}
.remember input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
.forgot{color:var(--accent);text-decoration:none}
.forgot:hover{color:var(--accent2);text-decoration:underline}

/* ========== 登录按钮 ========== */
.btn-login{
width:100%;padding:13px;border:none;border-radius:10px;
background:linear-gradient(135deg,var(--accent),var(--accent2));
color:#fff;font-size:15px;font-weight:600;cursor:pointer;
box-shadow:0 6px 18px rgba(168,85,247,.35);transition:transform .15s,box-shadow .2s}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(168,85,247,.45)}
.btn-login:active{transform:scale(.99)}
.btn-login:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-login:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* 按钮内加载动画 */
.spinner{
display:inline-block;width:16px;height:16px;vertical-align:-3px;margin-right:6px;
border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;
animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ========== 快捷填充按钮 ========== */
.btn-quick{
width:100%;margin-top:12px;padding:10px;border:1px solid var(--border);
border-radius:10px;background:rgba(255,255,255,.04);color:var(--muted);
font-size:13px;cursor:pointer;transition:all .2s}
.btn-quick:hover{color:var(--text);border-color:var(--accent);background:rgba(168,85,247,.1)}

/* ========== 提示消息 ========== */
.msg{display:none;margin-top:16px;padding:10px 14px;border-radius:8px;font-size:13px;text-align:center}
.msg.show{display:block;animation:msgIn .25s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.msg.ok{background:rgba(52,211,153,.14);color:var(--ok);border:1px solid rgba(52,211,153,.35)}
.msg.err{background:rgba(248,113,113,.14);color:var(--err);border:1px solid rgba(248,113,113,.35)}

/* ========== 演示账号提示 ========== */
.demo{
margin-top:20px;padding:12px 14px;border:1px dashed var(--border);
border-radius:10px;background:rgba(255,255,255,.04);
font-size:12.5px;color:var(--muted);text-align:center;line-height:1.7}
.demo code{background:rgba(168,85,247,.2);color:#d8b4fe;padding:2px 7px;border-radius:5px;font-size:12px}

/* ========== 页脚 ========== */
.footer{margin-top:24px;text-align:center;font-size:12px;color:rgba(156,163,175,.7)}
.footer a{color:var(--muted);text-decoration:none}
.footer a:hover{color:var(--text)}

/* ========== 响应式与浅色模式 ========== */
@media(max-width:480px){.login-card{padding:30px 22px 24px}.brand h1{font-size:20px}}
@media(prefers-color-scheme:light){
:root{--bg1:#f3e8ff;--bg2:#fce7f3;--text:#1f2937;--muted:#6b7280;
--card:rgba(255,255,255,.75);--border:rgba(0,0,0,.1);--input:rgba(0,0,0,.04);
--shadow:0 20px 60px rgba(88,28,135,.18)}
.input-wrap input{color:#1f2937}
.input-wrap input::placeholder{color:rgba(107,114,128,.5)}
.demo{background:rgba(0,0,0,.03)}}
</style>
</head>
<body>
<!-- 粒子动画背景 -->
<canvas id="particles"></canvas>

<div class="login-card">
  <!-- 品牌区 -->
  <div class="brand">
    <div class="logo">S</div>
    <h1>SUPERCRZY BOT</h1>
    <p>Stay Crazy. Think Clear. About AI.</p>
  </div>

  <!-- 登录表单 -->
  <form id="loginForm" novalidate>
    <div class="field">
      <label for="username">用户名</label>
      <div class="input-wrap">
        <span class="icon">👤</span>
        <input type="text" id="username" placeholder="请输入用户名" autocomplete="username" required>
      </div>
    </div>

    <div class="field">
      <label for="password">密码</label>
      <div class="input-wrap">
        <span class="icon">🔒</span>
        <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
        <button type="button" class="toggle-pw" id="togglePw" title="显示/隐藏密码">👁</button>
      </div>
      <!-- 密码强度指示 -->
      <div class="strength" id="strength"><i id="strengthBar"></i></div>
      <div class="strength-tip" id="strengthTip">💡 建议 8 位以上，混合字母、数字与符号</div>
    </div>

    <div class="options">
      <label class="remember"><input type="checkbox" id="remember"> 记住我</label>
      <a href="#" class="forgot" id="forgotLink">忘记密码？</a>
    </div>

    <button type="submit" class="btn-login" id="btnLogin">登 录</button>
    <!-- 一键填充演示账号（演示环境便捷入口） -->
    <button type="button" class="btn-quick" id="btnQuick">⚡ 一键填充演示账号</button>
    <div class="msg" id="msg"></div>
  </form>

  <!-- 演示账号说明 -->
  <div class="demo">演示账号：<code>admin</code> / <code>123456</code><br>点击登录体验完整流程</div>

  <!-- 页脚 -->
  <div class="footer">© 2026 <a href="https://supercrzy.com" target="_blank" rel="noopener">supercrzy.com</a> · All Rights Reserved</div>
</div>

<script>
/* ========== 粒子动画背景 ========== */
(function(){
  var cv=document.getElementById("particles"),ctx=cv.getContext("2d"),ps=[];
  var COLORS=["#a855f7","#ec4899","#f59e0b","#60a5fa"];
  function resize(){cv.width=innerWidth;cv.height=innerHeight}
  function spawn(){
    ps=[];
    for(var i=0,n=Math.min(60,Math.floor(innerWidth/18));i<n;i++){
      ps.push({x:Math.random()*cv.width,y:Math.random()*cv.height,
        r:Math.random()*2.2+.6,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,
        c:COLORS[Math.floor(Math.random()*COLORS.length)],a:Math.random()*.5+.2});
    }
  }
  function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    for(var i=0;i<ps.length;i++){
      var p=ps[i];p.x+=p.vx;p.y+=p.vy;
      if(p.x<-10)p.x=cv.width+10;if(p.x>cv.width+10)p.x=-10;
      if(p.y<-10)p.y=cv.height+10;if(p.y>cv.height+10)p.y=-10;
      ctx.globalAlpha=p.a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    }
    /* 邻近粒子连线 */
    ctx.globalAlpha=.08;ctx.strokeStyle="#a855f7";ctx.lineWidth=.6;
    for(var i=0;i<ps.length;i++)for(var j=i+1;j<ps.length;j++){
      var dx=ps[i].x-ps[j].x,dy=ps[i].y-ps[j].y;
      if(dx*dx+dy*dy<130*130){ctx.beginPath();ctx.moveTo(ps[i].x,ps[i].y);ctx.lineTo(ps[j].x,ps[j].y);ctx.stroke();}
    }
    requestAnimationFrame(tick);
  }
  addEventListener("resize",function(){resize();spawn();});
  resize();spawn();tick();
})();

/* ========== 表单逻辑 ========== */
(function(){
  var form=document.getElementById("loginForm"),
      user=document.getElementById("username"),
      pw=document.getElementById("password"),
      btn=document.getElementById("btnLogin"),
      msg=document.getElementById("msg"),
      rem=document.getElementById("remember"),
      bar=document.getElementById("strengthBar"),
      tip=document.getElementById("strengthTip"),
      DEMO_USER="admin",DEMO_PASS="123456";

  /* 记住我：回填已保存账号 */
  var saved=localStorage.getItem("sbz_username");
  if(saved){user.value=saved;rem.checked=true;pw.focus();}else{user.focus();}

  /* 密码显隐切换 */
  document.getElementById("togglePw").addEventListener("click",function(){
    var hidden=pw.type==="password";
    pw.type=hidden?"text":"password";
    this.textContent=hidden?"🙈":"👁";
  });

  /* 密码强度检测（弱/中/强 三档） */
  function strengthScore(v){
    var s=0;
    if(v.length>=8)s++;
    if(/[a-z]/.test(v)&&/[A-Z]/.test(v))s++;
    if(/\d/.test(v))s++;
    if(/[^a-zA-Z0-9]/.test(v))s++;
    return s;
  }
  pw.addEventListener("input",function(){
    if(!pw.value){bar.style.width="0";tip.className="strength-tip";return;}
    var s=strengthScore(pw.value),colors=["var(--err)","var(--warn)","var(--ok)"];
    bar.style.width=(s<2?33:s<4?66:100)+"%";
    bar.style.background=colors[s<2?0:s<4?1:2];
    tip.className="strength-tip show";
  });

  /* 提示消息（3.5s 自动消失） */
  function show(text,type){
    msg.textContent=text;msg.className="msg show "+type;
    clearTimeout(show._t);show._t=setTimeout(function(){msg.className="msg"},3500);
  }

  /* 表单校验 */
  function validate(){
    if(!user.value.trim()){show("⚠️ 请输入用户名","err");user.focus();return false;}
    if(!pw.value){show("⚠️ 请输入密码","err");pw.focus();return false;}
    if(pw.value.length<6){show("⚠️ 密码长度至少 6 位","err");return false;}
    return true;
  }

  /* 提交（模拟异步登录） */
  form.addEventListener("submit",function(e){
    e.preventDefault();
    if(!validate())return;
    btn.disabled=true;btn.innerHTML='<span class="spinner"></span>登录中...';
    setTimeout(function(){
      var ok=user.value.trim()===DEMO_USER&&pw.value===DEMO_PASS;
      if(ok){
        /* 记住我：保存/清除本地账号 */
        if(rem.checked)localStorage.setItem("sbz_username",user.value.trim());
        else localStorage.removeItem("sbz_username");
        show("✅ 登录成功，正在跳转…","ok");
        setTimeout(function(){location.href="https://supercrzy.com"},900);
      }else{
        btn.disabled=false;btn.innerHTML="登 录";
        show("❌ 账号或密码错误","err");pw.value="";pw.focus();
      }
    },800);
  });

  /* 一键填充演示账号 */
  document.getElementById("btnQuick").addEventListener("click",function(){
    user.value=DEMO_USER;pw.value=DEMO_PASS;rem.checked=true;
    show("✅ 已填充演示账号，点击「登 录」即可","ok");
  });

  /* 忘记密码（演示提示） */
  document.getElementById("forgotLink").addEventListener("click",function(e){
    e.preventDefault();show("🔑 演示环境：请联系管理员重置密码","ok");
  });
})();
</script>
</body>
</html>
