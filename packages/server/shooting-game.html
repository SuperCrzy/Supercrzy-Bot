<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太空射击 - SUPERCRZY</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e1a;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; font-family: 'Courier New', monospace; color: #fff;
  }
  h1 { font-size: 22px; letter-spacing: 4px; margin-bottom: 12px; color: #7ee8fa;
       text-shadow: 0 0 10px rgba(126,232,250,.6); }
  canvas { background: #0a0e1a; border: 2px solid #2a3550; border-radius: 8px;
           box-shadow: 0 0 30px rgba(0,150,255,.15); }
  #info { margin-top: 12px; font-size: 14px; color: #8fa3c8; text-align: center; }
  kbd { background: #1c2742; padding: 2px 8px; border-radius: 4px; border: 1px solid #3a4a6e; }
</style>
</head>
<body>
<h1>🚀 太空射击</h1>
<canvas id="game" width="480" height="640"></canvas>
<div id="info">
  <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>A</kbd> <kbd>D</kbd> 移动 &nbsp;|&nbsp; <kbd>空格</kbd> 射击 &nbsp;|&nbsp; <kbd>R</kbd> 重新开始
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ---- 游戏状态 ----
let score = 0, lives = 3, level = 1;
let gameOver = false, paused = false;
let lastTime = 0, spawnTimer = 0, shootCooldown = 0;

// ---- 玩家 ----
const player = { x: W / 2, y: H - 60, w: 40, h: 34, speed: 260 };

// ---- 子弹 / 敌人 / 特效 ----
let bullets = [], enemies = [], particles = [];

// ---- 输入 ----
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
  if (e.code === 'KeyR' && gameOver) resetGame();
  if (e.code === 'KeyP') paused = !paused;
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

function resetGame() {
  score = 0; lives = 3; level = 1; gameOver = false;
  bullets = []; enemies = []; particles = [];
  player.x = W / 2; spawnTimer = 0;
}

// ---- 工具函数 ----
function rand(min, max) { return Math.random() * (max - min) + min; }

function spawnEnemy() {
  const type = Math.random() < 0.25 ? 'fast' : 'normal';
  enemies.push({
    x: rand(20, W - 20),
    y: -30,
    r: type === 'fast' ? 10 : 16,
    hp: type === 'fast' ? 1 : 2,
    speed: type === 'fast' ? rand(120, 160) : rand(45, 75) + level * 6,
    type,
    wobble: rand(0, Math.PI * 2)
  });
}

function fire() {
  bullets.push({ x: player.x, y: player.y - 20, vy: -520 });
}

function addParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const angle = rand(0, Math.PI * 2), speed = rand(60, 220);
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: rand(0.3, 0.8),
      color
    });
  }
}

// ---- 更新 ----
function update(dt) {
  if (paused || gameOver) return;

  // 玩家移动
  const dir = (keys['ArrowRight'] || keys['KeyD'] ? 1 : 0) - (keys['ArrowLeft'] || keys['KeyA'] ? 1 : 0);
  player.x += dir * player.speed * dt;
  player.x = Math.max(22, Math.min(W - 22, player.x));

  // 射击
  shootCooldown -= dt;
  if (keys['Space'] && shootCooldown <= 0) {
    fire();
    shootCooldown = 0.18;
  }

  // 生成敌人（随等级加快）
  spawnTimer -= dt;
  const spawnInterval = Math.max(0.35, 1.4 - level * 0.12);
  if (spawnTimer <= 0) {
    spawnEnemy();
    if (level > 1 && Math.random() < 0.3) spawnEnemy();
    spawnTimer = spawnInterval;
  }

  // 子弹
  bullets = bullets.filter(b => b.y > -20);
  bullets.forEach(b => b.y += b.vy * dt);

  // 敌人
  enemies.forEach(e => {
    e.y += e.speed * dt;
    e.wobble += dt * 2;
    e.x += Math.sin(e.wobble) * 30 * dt;
  });

  // 碰撞：子弹 vs 敌人
  for (let i = bullets.length - 1; i >= 0; i--) {
    for (let j = enemies.length - 1; j >= 0; j--) {
      const b = bullets[i], e = enemies[j];
      if (!b || !e) continue;
      const dx = b.x - e.x, dy = b.y - e.y;
      if (dx * dx + dy * dy < (e.r + 4) * (e.r + 4)) {
        e.hp--;
        bullets.splice(i, 1);
        if (e.hp <= 0) {
          addParticles(e.x, e.y, e.type === 'fast' ? '#ff9f43' : '#ff6b6b', 14);
          score += e.type === 'fast' ? 30 : 10;
          enemies.splice(j, 1);
        } else {
          addParticles(e.x, e.y, '#ffeaa7', 5);
        }
        break;
      }
    }
  }

  // 碰撞：玩家 vs 敌人 / 敌人越界
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const dx = e.x - player.x, dy = e.y - player.y;
    if (dx * dx + dy * dy < (e.r + 16) * (e.r + 16)) {
      addParticles(player.x, player.y, '#7ee8fa', 20);
      lives--;
      enemies.splice(i, 1);
      if (lives <= 0) gameOver = true;
      continue;
    }
    if (e.y > H + 30) {
      enemies.splice(i, 1);
      lives--;
      if (lives <= 0) gameOver = true;
    }
  }

  // 粒子
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
  });

  // 升级
  const newLevel = Math.floor(score / 200) + 1;
  if (newLevel > level) { level = newLevel; addParticles(player.x, player.y, '#fdcb6e', 30); }
}

// ---- 渲染 ----
function drawStars(t) {
  // 简易星星背景（用固定随机位置 + 滚动）
  for (let i = 0; i < 40; i++) {
    const sx = (i * 97) % W, sy = ((i * 53 + t * (20 + i % 5 * 10)) % H);
    const size = i % 3 === 0 ? 2 : 1;
    ctx.fillStyle = i % 2 === 0 ? '#4a5a80' : '#6a7fa8';
    ctx.fillRect(sx, sy, size, size);
  }
}

function drawPlayer() {
  ctx.save();
  ctx.translate(player.x, player.y);
  // 火焰
  ctx.fillStyle = '#ff9f43';
  ctx.beginPath();
  ctx.moveTo(-5, 16); ctx.lineTo(5, 16); ctx.lineTo(0, 26);
  ctx.closePath(); ctx.fill();
  // 机身
  ctx.fillStyle = '#7ee8fa';
  ctx.beginPath();
  ctx.moveTo(0, -20); ctx.lineTo(18, 14); ctx.lineTo(10, 18); ctx.lineTo(0, 12); ctx.lineTo(-10, 18); ctx.lineTo(-18, 14);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#0a0e1a';
  ctx.beginPath(); ctx.arc(0, -4, 5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function draw() {
  const t = performance.now() / 1000;
  drawStars(t);

  // 子弹
  ctx.fillStyle = '#ffeaa7';
  bullets.forEach(b => { ctx.fillRect(b.x - 2, b.y - 8, 4, 14); });

  // 敌人
  enemies.forEach(e => {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.fillStyle = e.type === 'fast' ? '#ff9f43' : '#ff6b6b';
    ctx.beginPath();
    for (let k = 0; k < 8; k++) {
      const r = k % 2 === 0 ? e.r : e.r * 0.55;
      const a = (k / 8) * Math.PI * 2 - Math.PI / 2;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      k === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    if (e.hp > 1) {
      ctx.fillStyle = '#fff';
      ctx.font = '10px monospace'; ctx.textAlign = 'center';
      ctx.fillText(e.hp, 0, 3);
    }
    ctx.restore();
  });

  drawPlayer();

  // 粒子
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  });
  ctx.globalAlpha = 1;

  // HUD
  ctx.fillStyle = '#fff';
  ctx.font = '16px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('得分 ' + score, 12, 26);
  ctx.textAlign = 'right';
  ctx.fillText('第 ' + level + ' 关', W - 12, 26);
  ctx.textAlign = 'left';
  for (let i = 0; i < lives; i++) ctx.fillText('❤', 12 + i * 24, 50);

  // 暂停 / 结束
  if (paused && !gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '28px monospace';
    ctx.fillText('已暂停', W / 2, H / 2);
  }
  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff6b6b'; ctx.textAlign = 'center'; ctx.font = '36px monospace';
    ctx.fillText('游 戏 结 束', W / 2, H / 2 - 30);
    ctx.fillStyle = '#fff'; ctx.font = '20px monospace';
    ctx.fillText('最终得分: ' + score, W / 2, H / 2 + 10);
    ctx.fillStyle = '#7ee8fa'; ctx.font = '16px monospace';
    ctx.fillText('按 R 重新开始', W / 2, H / 2 + 50);
  }
}

// ---- 主循环 ----
function loop(ts) {
  const dt = Math.min(0.05, (ts - lastTime) / 1000 || 0.016);
  lastTime = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
