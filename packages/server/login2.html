<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPERCRZY BOT · 登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    overflow: hidden;
    position: relative;
  }

  /* 漂浮光球装饰 */
  .orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .5; animation: float 8s ease-in-out infinite; }
  .orb-1 { width: 300px; height: 300px; background: #a78bfa; top: -80px; left: -80px; }
  .orb-2 { width: 260px; height: 260px; background: #60a5fa; bottom: -60px; right: -60px; animation-delay: -4s; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-30px); } }

  .card {
    position: relative;
    z-index: 1;
    width: 400px;
    max-width: 92vw;
    background: rgba(255,255,255,.95);
    border-radius: 20px;
    padding: 40px 36px 32px;
    box-shadow: 0 25px 60px rgba(0,0,0,.3);
    backdrop-filter: blur(10px);
    animation: rise .6s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

  .logo {
    width: 56px; height: 56px; margin: 0 auto 14px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 26px; font-weight: 800;
    box-shadow: 0 8px 20px rgba(102,126,234,.4);
  }
  h1 { text-align: center; font-size: 22px; color: #1f2937; letter-spacing: 1px; }
  .sub { text-align: center; color: #9ca3af; font-size: 13px; margin: 6px 0 26px; }

  .tabs { display: flex; background: #f3f4f6; border-radius: 10px; padding: 4px; margin-bottom: 22px; }
  .tab {
    flex: 1; text-align: center; padding: 8px 0; border-radius: 8px;
    font-size: 14px; color: #6b7280; cursor: pointer; transition: all .25s; user-select: none;
  }
  .tab.active { background: #fff; color: #667eea; font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,.08); }

  .field { margin-bottom: 16px; position: relative; }
  .field label { display: block; font-size: 13px; color: #4b5563; margin-bottom: 6px; }
  .field .wrap { position: relative; }
  .field .icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    font-size: 16px; color: #9ca3af; pointer-events: none;
  }
  .field input {
    width: 100%; padding: 11px 40px 11px 38px;
    border: 1.5px solid #e5e7eb; border-radius: 10px;
    font-size: 14px; outline: none; transition: border-color .2s, box-shadow .2s;
    background: #fafafa;
  }
  .field input:focus { border-color: #667eea; background: #fff; box-shadow: 0 0 0 3px rgba(102,126,234,.15); }
  .field .toggle-pwd {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: none; border: none; font-size: 15px; color: #9ca3af; cursor: pointer; padding: 4px;
  }
  .field .toggle-pwd:hover { color: #667eea; }

  .row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 20px; }
  .row label { display: flex; align-items: center; gap: 6px; color: #6b7280; cursor: pointer; }
  .row input[type=checkbox] { accent-color: #667eea; width: 15px; height: 15px; }
  .row a { color: #667eea; text-decoration: none; }
  .row a:hover { text-decoration: underline; }

  .btn {
    width: 100%; padding: 12px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 6px 16px rgba(102,126,234,.35);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(102,126,234,.45); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: .6; cursor: not-allowed; }

  .divider { display: flex; align-items: center; gap: 12px; margin: 22px 0 16px; color: #9ca3af; font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #e5e7eb; }

  .social { display: flex; justify-content: center; gap: 14px; }
  .social button {
    width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid #e5e7eb;
    background: #fff; font-size: 18px; cursor: pointer; transition: all .2s;
    display: flex; align-items: center; justify-content: center;
  }
  .social button:hover { border-color: #667eea; transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,.1); }

  .msg { text-align: center; font-size: 13px; margin-top: 14px; min-height: 20px; }
  .msg.ok { color: #10b981; }
  .msg.err { color: #ef4444; }

  .footer { text-align: center; color: #c4b5fd; font-size: 12px; margin-top: 24px; }
  .footer a { color: #ede9fe; text-decoration: none; }
</style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card">
    <div class="logo">S</div>
    <h1>SUPERCRZY BOT</h1>
    <p class="sub">欢迎回来，请登录你的账号</p>

    <div class="tabs">
      <div class="tab active" id="tab-login" onclick="switchTab('login')">登录</div>
      <div class="tab" id="tab-register" onclick="switchTab('register')">注册</div>
    </div>

    <!-- 登录表单 -->
    <form id="login-form" onsubmit="return doLogin(event)">
      <div class="field">
        <label>用户名 / 邮箱</label>
        <div class="wrap">
          <span class="icon">👤</span>
          <input type="text" id="login-user" placeholder="请输入用户名或邮箱" autocomplete="username">
        </div>
      </div>
      <div class="field">
        <label>密码</label>
        <div class="wrap">
          <span class="icon">🔒</span>
          <input type="password" id="login-pwd" placeholder="请输入密码" autocomplete="current-password">
          <button type="button" class="toggle-pwd" onclick="togglePwd('login-pwd', this)">👁</button>
        </div>
      </div>
      <div class="row">
        <label><input type="checkbox" id="remember"> 记住我</label>
        <a href="#" onclick="alert('演示版：请联系管理员重置密码')">忘记密码？</a>
      </div>
      <button class="btn" type="submit">登 录</button>
    </form>

    <!-- 注册表单 -->
    <form id="register-form" style="display:none" onsubmit="return doRegister(event)">
      <div class="field">
        <label>用户名</label>
        <div class="wrap">
          <span class="icon">👤</span>
          <input type="text" id="reg-user" placeholder="设置用户名（至少3位）">
        </div>
      </div>
      <div class="field">
        <label>邮箱</label>
        <div class="wrap">
          <span class="icon">✉️</span>
          <input type="email" id="reg-email" placeholder="example@mail.com">
        </div>
      </div>
      <div class="field">
        <label>密码</label>
        <div class="wrap">
          <span class="icon">🔒</span>
          <input type="password" id="reg-pwd" placeholder="设置密码（至少6位）">
          <button type="button" class="toggle-pwd" onclick="togglePwd('reg-pwd', this)">👁</button>
        </div>
      </div>
      <button class="btn" type="submit" style="margin-top:4px">注 册</button>
    </form>

    <div class="divider">或使用第三方登录</div>
    <div class="social">
      <button title="微信登录" onclick="socialLogin('微信')">💬</button>
      <button title="GitHub 登录" onclick="socialLogin('GitHub')">🐙</button>
      <button title="Google 登录" onclick="socialLogin('Google')">🔵</button>
    </div>

    <div class="msg" id="msg"></div>
    <div class="footer">© 2025 SUPERCRZY · <a href="#" onclick="alert('演示页面')">帮助中心</a></div>
  </div>

<script>
  // ====== 演示账号 ======
  const DEMO_USER = { username: 'admin', password: '123456' };

  function switchTab(t) {
    document.getElementById('tab-login').classList.toggle('active', t === 'login');
    document.getElementById('tab-register').classList.toggle('active', t === 'register');
    document.getElementById('login-form').style.display = t === 'login' ? '' : 'none';
    document.getElementById('register-form').style.display = t === 'register' ? '' : 'none';
    setMsg('');
  }

  function togglePwd(id, btn) {
    const input = document.getElementById(id);
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.textContent = show ? '🙈' : '👁';
  }

  function setMsg(text, ok) {
    const m = document.getElementById('msg');
    m.textContent = text;
    m.className = 'msg ' + (ok ? 'ok' : text ? 'err' : '');
  }

  function doLogin(e) {
    e.preventDefault();
    const user = document.getElementById('login-user').value.trim();
    const pwd = document.getElementById('login-pwd').value.trim();
    if (!user || !pwd) return setMsg('请输入用户名和密码');

    // 模拟异步请求
    document.querySelector('.btn').disabled = true;
    document.querySelector('.btn').textContent = '登录中...';
    setTimeout(() => {
      document.querySelector('.btn').disabled = false;
      document.querySelector('.btn').textContent = '登 录';
      if (user === DEMO_USER.username && pwd === DEMO_USER.password) {
        setMsg('✅ 登录成功！欢迎回来，' + user, true);
        // 演示：跳转到主页（可换成真实地址）
        setTimeout(() => location.href = 'https://supercrzy.com', 1200);
      } else {
        setMsg('❌ 用户名或密码错误（演示账号：admin / 123456）');
      }
    }, 800);
    return false;
  }

  function doRegister(e) {
    e.preventDefault();
    const user = document.getElementById('reg-user').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const pwd = document.getElementById('reg-pwd').value.trim();
    if (user.length < 3) return setMsg('用户名至少 3 个字符');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return setMsg('邮箱格式不正确');
    if (pwd.length < 6) return setMsg('密码至少 6 位');
    setMsg('✅ 注册成功！请返回登录（演示页面，数据不会真正保存）', true);
    setTimeout(() => switchTab('login'), 1500);
    return false;
  }

  function socialLogin(name) {
    setMsg(`正在跳转 ${name} 授权...`);
    setTimeout(() => setMsg(`⚠️ 演示页面：${name} 登录未接入后端`, false), 1200);
  }

  // 回车提交
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const visible = document.getElementById('login-form').style.display !== 'none';
      visible ? doLogin(e) : doRegister(e);
    }
  });
</script>
</body>
</html>
