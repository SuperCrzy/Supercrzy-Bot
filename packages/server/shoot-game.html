<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太空射击 - SUPERCRZY</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #0b0b1e 0%, #1a1040 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #fff;
  }
  h1 {
    font-size: 22px;
    letter-spacing: 4px;
    margin-bottom: 12px;
    text-shadow: 0 0 12px rgba(120, 180, 255, .8);
  }
  #gameCanvas {
    background: radial-gradient(ellipse at center, #14143a 0%, #05050f 100%);
    border: 1px solid #3a3a7a;
    border-radius: 10px;
    box-shadow: 0 0 30px rgba(80, 120, 255, .25);
    display: block;
    cursor: none;
  }
  #controls {
    margin-top: 14px;
    font-size: 13px;
    color: #aab;
    text-align: center;
    line-height: 1.8;
  }
  kbd {
    background: #2a2a55;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 1px 7px;
    font-size: 12px;
    color: #cfe;
  }
</style>
</head>
<body>
<h1>🚀 太空射击</h1>
<canvas id="gameCanvas" width="520" height="640"></canvas>
<div id="controls">
  <kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd> 移动 &nbsp;|&nbsp;
  <kbd>空格</kbd> 射击 &nbsp;|&nbsp;
  <kbd>R</kbd> 重新开始
</div>

<script>
(function () {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // ---------- 游戏状态 ----------
  let state = 'ready';           // ready | playing | over
  let score = 0;
  let lives = 3;
  let time = 0;                  // 游戏总时长（帧数）
  let keys = {};

  // 玩家
  const player = {
    x: W / 2, y: H - 60, w: 44, h: 44,
    speed: 5.2
  };

  // 子弹 / 敌机
  let bullets = [];
  let enemies = [];
  let spawnTimer = 0;

  // ---------- 输入 ----------
  document.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') e.preventDefault();
    if (e.code === 'KeyR') {
      if (state === 'over' || state === 'ready') initGame();
    }
  });
  document.addEventListener('keyup', e => { keys[e.code] = false; });

  // 鼠标控制（可选：按住鼠标也可射击）
  canvas.addEventListener('mousedown', () => { if (state === 'playing') keys['Mouse'] = true; });
  window.addEventListener('mouseup', () => { keys['Mouse'] = false; });

  // ---------- 初始化 ----------
  function initGame() {
    state = 'playing';
    score = 0; lives = 3; time = 0;
    bullets = []; enemies = [];
    spawnTimer = 0;
    player.x = W / 2;
  }

  // ---------- 生成敌机 ----------
  function spawnEnemy() {
    // 难度随时间和分数提升
    const kinds = [
      { r: 14, hp: 1, speed: 1.6, color: '#ff5d5d', score: 10 },   // 小红
      { r: 18, hp: 2, speed: 1.1, color: '#ffb84d', score: 25 },   // 橙中
      { r: 11, hp: 1, speed: 3.0, color: '#7dff6a', score: 15 }    // 绿快
    ];
    let pool = kinds;
    if (score >= 100) pool = kinds;                // 全解锁
    else if (score >= 50) pool = kinds.slice(0, 2);
    else pool = kinds.slice(0, 1);
    const k = pool[Math.floor(Math.random() * pool.length)];
    enemies.push({
      x: Math.random() * (W - 60) + 30,
      y: -30,
      r: k.r, hp: k.hp, maxHp: k.hp,
      speed: k.speed * (1 + Math.min(time / 6000, 0.8)),
      color: k.color, score: k.score
    });
  }

  // ---------- 更新逻辑 ----------
  function update() {
    if (state !== 'playing') return;
    time++;

    // 移动玩家
    if (keys['ArrowLeft']  || keys['KeyA']) player.x -= player.speed;
    if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
    player.x = Math.max(30, Math.min(W - 30, player.x));

    // 射击（每 8 帧一发）
    if ((keys['Space'] || keys['Mouse']) && time % 8 === 0) {
      bullets.push({ x: player.x, y: player.y - 20, vy: -7.5, r: 3 });
    }

    // 更新子弹
    bullets = bullets.filter(b => {
      b.y += b.vy;
      return b.y > -20;
    });

    // 生成敌机（频率随难度提升）
    spawnTimer++;
    const interval = Math.max(18, 45 - Math.floor(time / 250));
    if (spawnTimer >= interval) { spawnTimer = 0; spawnEnemy(); }

    // 更新敌机
    enemies.forEach(e => e.y += e.speed);
    enemies = enemies.filter(e => e.y < H + 40);

    // 子弹 vs 敌机
    for (let i = bullets.length - 1; i >= 0; i--) {
      for (let j = enemies.length - 1; j >= 0; j--) {
        const b = bullets[i], e = enemies[j];
        if (!b || !e) continue;
        const dx = b.x - e.x, dy = b.y - e.y;
        if (dx * dx + dy * dy < (b.r + e.r) * (b.r + e.r)) {
          e.hp--;
          bullets.splice(i, 1);
          if (e.hp <= 0) {
            score += e.score;
            enemies.splice(j, 1);
          }
          break;
        }
      }
    }

    // 敌机 vs 玩家
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      const dx = e.x - player.x, dy = e.y - player.y;
      const rr = e.r + player.w / 2 - 4;
      if (dx * dx + dy * dy < rr * rr) {
        enemies.splice(j, 1);
        lives--;
        if (lives <= 0) { state = 'over'; return; }
      }
    }
  }

  // ---------- 绘制 ----------
  function drawStarfield() {
    // 简易星空（用伪随机固定点）
    for (let i = 0; i < 60; i++) {
      const sx = (i * 73) % W, sy = ((i * 137) % H + time * (0.2 + (i % 3) * 0.15)) % H;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.2 + (i % 4) * 0.15) + ')';
      ctx.fillRect(sx, sy, 2, 2);
    }
  }

  function drawPlayer() {
    ctx.save();
    ctx.translate(player.x, player.y);
    // 机身
    ctx.fillStyle = '#4dd0ff';
    ctx.beginPath();
    ctx.moveTo(0, -22); ctx.lineTo(15, 14); ctx.lineTo(6, 10);
    ctx.lineTo(0, 20); ctx.lineTo(-6, 10); ctx.lineTo(-15, 14);
    ctx.closePath(); ctx.fill();
    // 机舱
    ctx.fillStyle = '#eafcff';
    ctx.beginPath(); ctx.arc(0, -4, 5, 0, Math.PI * 2); ctx.fill();
    // 尾焰
    if (state === 'playing') {
      const flick = 10 + Math.sin(time * 0.6) * 5;
      ctx.fillStyle = 'rgba(255,170,60,.9)';
      ctx.beginPath();
      ctx.moveTo(-4, 18); ctx.lineTo(4, 18); ctx.lineTo(0, 18 + flick);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function drawEnemies() {
    enemies.forEach(e => {
      ctx.save();
      ctx.translate(e.x, e.y);
      // 敌机圆体
      ctx.fillStyle = e.color;
      ctx.beginPath(); ctx.arc(0, 0, e.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.beginPath(); ctx.arc(-e.r * 0.3, -e.r * 0.3, e.r * 0.5, 0, Math.PI * 2); ctx.fill();
      // 眼睛
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-4, -2, 3.5, 0, Math.PI * 2); ctx.arc(4, -2, 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(-4, -2, 1.6, 0, Math.PI * 2); ctx.arc(4, -2, 1.6, 0, Math.PI * 2); ctx.fill();
      // 血条（多血敌人）
      if (e.maxHp > 1) {
        ctx.fillStyle = 'rgba(0,0,0,.5)';
        ctx.fillRect(-e.r, -e.r - 8, e.r * 2, 4);
        ctx.fillStyle = '#7dff6a';
        ctx.fillRect(-e.r, -e.r - 8, e.r * 2 * (e.hp / e.maxHp), 4);
      }
      ctx.restore();
    });
  }

  function drawBullets() {
    bullets.forEach(b => {
      ctx.fillStyle = '#ffe95d';
      ctx.shadowColor = '#ffe95d'; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    });
  }

  function drawHUD() {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px "PingFang SC", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('得分 ' + score, 14, 28);
    ctx.textAlign = 'right';
    let hearts = '';
    for (let i = 0; i < lives; i++) hearts += '❤️';
    ctx.font = '16px sans-serif';
    ctx.fillText(hearts, W - 14, 28);
    ctx.textAlign = 'left';
  }

  function drawOverlay(title, sub) {
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 34px "PingFang SC", sans-serif';
    ctx.fillText(title, W / 2, H / 2 - 20);
    ctx.font = '17px "PingFang SC", sans-serif';
    ctx.fillStyle = '#ccd';
    ctx.fillText(sub, W / 2, H / 2 + 22);
    ctx.textAlign = 'left';
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawStarfield();
    if (state === 'playing' || state === 'over') {
      drawEnemies();
      drawBullets();
      drawPlayer();
      drawHUD();
    }
    if (state === 'ready') {
      drawOverlay('太空射击', '按 空格 开始  |  左右键移动  |  R 重开');
    }
    if (state === 'over') {
      drawOverlay('游戏结束', '最终得分 ' + score + '  |  按 R 重新开始');
    }
  }

  // ---------- 主循环 ----------
  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // 空格也用于开始
  const origKeydown = document.onkeydown;
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && state === 'ready') initGame();
  });

  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
