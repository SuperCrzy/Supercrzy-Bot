<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - SUPERCRZY</title>
<style>
  :root {
    --bg-1: #0f172a;
    --bg-2: #1e1b4b;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --accent-glow: rgba(99, 102, 241, .45);
    --text: #f1f5f9;
    --text-dim: #94a3b8;
    --border: rgba(255,255,255,.08);
    --card: rgba(255,255,255,.055);
    --danger: #f87171;
    --success: #34d399;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(1000px 600px at 15% 10%, rgba(99,102,241,.25), transparent 60%),
      radial-gradient(900px 550px at 85% 90%, rgba(139,92,246,.22), transparent 60%),
      linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
    color: var(--text);
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  /* 背景装饰粒子网格 */
  .grid-overlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 30%, transparent 75%);
  }
  .blob {
    position: fixed; border-radius: 50%; filter: blur(90px); z-index: 0; opacity: .35;
  }
  .blob-1 { width: 340px; height: 340px; top: -120px; left: -100px; background: var(--accent); }
  .blob-2 { width: 300px; height: 300px; bottom: -120px; right: -80px; background: var(--accent-2); }

  .login-wrap {
    position: relative; z-index: 1;
    width: 100%; max-width: 430px;
  }

  /* 品牌区 */
  .brand {
    display: flex; align-items: center; gap: 12px;
    justify-content: center; margin-bottom: 28px;
  }
  .brand .logo {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 20px; color: #fff;
    box-shadow: 0 8px 24px var(--accent-glow);
  }
  .brand .name { font-size: 22px; font-weight: 700; letter-spacing: .5px; }

  /* 卡片 */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 32px 32px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 24px 60px rgba(0,0,0,.35);
  }
  .card h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  .card .sub { color: var(--text-dim); font-size: 14px; margin-bottom: 28px; }

  /* 表单 */
  .field { margin-bottom: 18px; }
  .field label {
    display: block; font-size: 13px; font-weight: 600;
    color: var(--text-dim); margin-bottom: 8px;
  }
  .input-box {
    position: relative;
    display: flex; align-items: center;
    background: rgba(255,255,255,.06);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: border-color .2s, box-shadow .2s;
  }
  .input-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .input-box .icon {
    padding-left: 14px; color: var(--text-dim);
    display: flex; align-items: center; font-size: 16px;
  }
  .input-box input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-size: 15px; padding: 13px 12px;
  }
  .input-box input::placeholder { color: rgba(148,163,184,.55); }
  .input-box .toggle-pwd {
    border: none; background: none; cursor: pointer;
    color: var(--text-dim); padding: 0 14px; font-size: 15px;
    display: flex; align-items: center;
  }
  .input-box .toggle-pwd:hover { color: var(--text); }

  .row-between {
    display: flex; align-items: center; justify-content: space-between;
    margin: 4px 0 22px;
  }
  .checkbox { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--text-dim); }
  .checkbox input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
  .link { font-size: 13px; color: var(--accent); text-decoration: none; font-weight: 500; }
  .link:hover { text-decoration: underline; }

  .btn-login {
    width: 100%; padding: 14px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
    letter-spacing: 2px;
    transition: transform .15s, box-shadow .2s, opacity .2s;
    box-shadow: 0 8px 24px var(--accent-glow);
  }
  .btn-login:hover { transform: translateY(-1px); box-shadow: 0 12px 32px var(--accent-glow); }
  .btn-login:active { transform: translateY(0); }
  .btn-login:disabled { opacity: .65; cursor: not-allowed; transform: none; }

  .divider {
    display: flex; align-items: center; gap: 14px;
    margin: 26px 0 20px; color: var(--text-dim); font-size: 12px;
  }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .socials { display: flex; gap: 12px; }
  .social-btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 11px 0; border-radius: 12px; cursor: pointer;
    background: rgba(255,255,255,.06); border: 1px solid var(--border);
    color: var(--text); font-size: 14px; font-weight: 500;
    transition: background .2s, border-color .2s;
  }
  .social-btn:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.2); }
  .social-btn svg { width: 17px; height: 17px; }

  .foot {
    text-align: center; margin-top: 26px;
    color: var(--text-dim); font-size: 14px;
  }
  .foot a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .foot a:hover { text-decoration: underline; }

  /* 提示条 */
  .tip {
    display: none; align-items: center; gap: 8px;
    font-size: 13px; border-radius: 10px; padding: 11px 14px; margin-bottom: 18px;
  }
  .tip.show { display: flex; }
  .tip.error { background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.3); color: var(--danger); }
  .tip.success { background: rgba(52,211,153,.12); border: 1px solid rgba(52,211,153,.3); color: var(--success); }

  .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,.35); border-top-color: #fff;
    border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -3px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 480px) {
    .card { padding: 28px 22px; }
    .brand .name { font-size: 19px; }
  }
</style>
</head>
<body>
<div class="grid-overlay"></div>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="login-wrap">
  <div class="brand">
    <div class="logo">S</div>
    <div class="name">SUPERCRZY</div>
  </div>

  <div class="card">
    <h1>欢迎回来 👋</h1>
    <p class="sub">登录你的账号，继续你的创作之旅</p>

    <div id="tip" class="tip"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">邮箱 / 手机号</label>
        <div class="input-box">
          <span class="icon">✉️</span>
          <input type="text" id="email" placeholder="you@example.com" autocomplete="username" required>
        </div>
      </div>

      <div class="field">
        <label for="password">密码</label>
        <div class="input-box">
          <span class="icon">🔒</span>
          <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
          <button type="button" class="toggle-pwd" id="togglePwd" aria-label="显示/隐藏密码">👁</button>
        </div>
      </div>

      <div class="row-between">
        <label class="checkbox">
          <input type="checkbox" id="remember"> 记住我
        </label>
        <a href="#" class="link" id="forgotLink">忘记密码？</a>
      </div>

      <button type="submit" class="btn-login" id="submitBtn">登 录</button>
    </form>

    <div class="divider">或使用以下方式登录</div>

    <div class="socials">
      <button class="social-btn" type="button" data-provider="google">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Google
      </button>
      <button class="social-btn" type="button" data-provider="github">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.75 2.69 1.25 3.34.95.1-.74.4-1.25.72-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.59.23 2.76.11 3.05.73.81 1.18 1.83 1.18 3.09 0 4.41-2.69 5.38-5.25 5.67.41.35.77 1.05.77 2.12 0 1.53-.01 2.76-.01 3.14 0 .31.21.67.8.56A10.52 10.52 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
        GitHub
      </button>
      <button class="social-btn" type="button" data-provider="wechat">
        <svg viewBox="0 0 24 24" fill="#07C160"><path d="M9.5 4C5.36 4 2 6.69 2 10c0 1.89 1.03 3.56 2.68 4.71L4 17l2.37-1.17c.48.13.98.22 1.5.28a5.94 5.94 0 0 1-.26-1.76c0-3.52 3.51-6.35 7.8-6.35h.68C15.28 5.53 12.64 4 9.5 4zm-2.7 3.4a.85.85 0 1 1 0 1.7.85.85 0 0 1 0-1.7zm5.6 0a.85.85 0 1 1 0 1.7.85.85 0 0 1 0-1.7zM22 14.5c0-2.86-3.02-5.17-6.75-5.17s-6.75 2.31-6.75 5.17 3.02 5.17 6.75 5.17c.62 0 1.22-.08 1.78-.21L19.3 20.5l-.62-2.02C20.44 17.49 22 16.11 22 14.5zm-8.5-.5a.72.72 0 1 1 0-1.44.72.72 0 0 1 0 1.44zm4 0a.72.72 0 1 1 0-1.44.72.72 0 0 1 0 1.44z"/></svg>
        微信
      </button>
    </div>

    <p class="foot">还没有账号？<a href="#" id="signupLink">立即注册</a></p>
  </div>
</div>

<script>
(function () {
  var form = document.getElementById('loginForm');
  var email = document.getElementById('email');
  var password = document.getElementById('password');
  var tip = document.getElementById('tip');
  var submitBtn = document.getElementById('submitBtn');
  var togglePwd = document.getElementById('togglePwd');

  // 记住我（localStorage）
  var remember = document.getElementById('remember');
  try {
    var saved = localStorage.getItem('scz_remember_email');
    if (saved) { email.value = saved; remember.checked = true; }
  } catch (e) {}

  // 显示/隐藏密码
  togglePwd.addEventListener('click', function () {
    var isPwd = password.type === 'password';
    password.type = isPwd ? 'text' : 'password';
    togglePwd.textContent = isPwd ? '🙈' : '👁';
  });

  function showTip(msg, type) {
    tip.textContent = msg;
    tip.className = 'tip show ' + type;
  }
  function clearTip() { tip.className = 'tip'; }

  // 模拟登录
  function fakeLogin(provider) {
    clearTip();
    var btn = submitBtn;
    var original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> 登录中...';
    setTimeout(function () {
      btn.disabled = false;
      btn.innerHTML = original;
      var who = provider ? (provider === 'google' ? 'Google' : provider === 'github' ? 'GitHub' : '微信') : '邮箱账号';
      showTip('✅ 登录成功（演示环境，已用「' + who + '」模拟通过）', 'success');
    }, 1200);
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    clearTip();

    var em = email.value.trim();
    var pwd = password.value;

    if (!em) { showTip('请输入邮箱或手机号', 'error'); email.focus(); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em) && !/^1\d{10}$/.test(em)) {
      showTip('邮箱或手机号格式不正确', 'error'); email.focus(); return;
    }
    if (!pwd) { showTip('请输入密码', 'error'); password.focus(); return; }
    if (pwd.length < 6) { showTip('密码至少 6 位', 'error'); password.focus(); return; }

    if (remember.checked) {
      try { localStorage.setItem('scz_remember_email', em); } catch (err) {}
    } else {
      try { localStorage.removeItem('scz_remember_email'); } catch (err) {}
    }

    fakeLogin();
  });

  // 第三方登录
  document.querySelectorAll('.social-btn').forEach(function (btn) {
    btn.addEventListener('click', function () { fakeLogin(btn.dataset.provider); });
  });

  // 忘记密码 / 注册：演示提示
  document.getElementById('forgotLink').addEventListener('click', function (e) {
    e.preventDefault();
    showTip('🔗 演示环境：密码重置流程未接入后端', 'success');
  });
  document.getElementById('signupLink').addEventListener('click', function (e) {
    e.preventDefault();
    showTip('📝 演示环境：注册流程未接入后端', 'success');
  });
})();
</script>
</body>
</html>
