name: Build Windows

# 为什么单独一个 workflow：
#   本机（macOS arm64）没有 wine，打不出 Windows 包（`scripts/build-dmg.sh` 只出 mac）。
#   GitHub Actions 的 windows-latest runner 是免费的，而且别人也能复现这条构建链路，
#   所以把它放在云端而不是依赖某台开发机。
#
# 这个 workflow 复现的是 build-dmg.sh 里被验证过的顺序，不是重写一套：
#   ① 前端先 build（dist 是静态产物，不 build 会打进旧版）
#   ② .deploy-server 用 **npm** 装真实依赖（pnpm workspace 软链在打包时会断）
#   ③ better-sqlite3 用 @electron/rebuild 匹配 Electron ABI
#   ④ 出厂门禁：包内 data 不许有凭据/DB；node_modules 不许留 openclaw/typescript/vite 等死重
#   ⑤ electron-builder 出 nsis 安装包
#
# 触发：手动（workflow_dispatch）或打 tag。不挂在每次 push 上 —— Windows 构建约 10 分钟，
#      日常提交没必要付这个成本。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the artifact (e.g. 1.1.3)"
        required: false
        default: "dev"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      # 与 ci.yml 同源：pnpm 版本读 package.json 的 packageManager，
      # Node 版本读 .nvmrc —— 不写死，避免两处漂移。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # ── ① 前端 + 引擎构建 ──
      - name: Build client and server
        run: pnpm build

      # ── ② 重建后端部署目录（真实依赖，非 pnpm 软链）──
      # PowerShell 没有 rsync，用 Copy-Item。这里刻意不用 robocopy：
      # 它的退出码语义（0/1/2/3 都算成功）和 GitHub Actions 的 step 判定会打架。
      - name: Stage backend for packaging
        shell: pwsh
        run: |
          $dst = "packages/desktop/.deploy-server"
          Remove-Item -Recurse -Force $dst -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$dst/src" | Out-Null
          Copy-Item -Recurse -Force "packages/server/src/*" "$dst/src/"
          Copy-Item -Force "packages/server/package.json" "$dst/"
          if (Test-Path "packages/server/tsconfig.json") {
            Copy-Item -Force "packages/server/tsconfig.json" "$dst/"
          }

          # 部署副本不需要 devDependencies / scripts（Electron 内部 Node 直接跑 src）
          $p = "$dst/package.json"
          $j = Get-Content $p -Raw | ConvertFrom-Json
          $n = if ($j.devDependencies) { $j.devDependencies.PSObject.Properties.Count } else { 0 }
          $j.PSObject.Properties.Remove('devDependencies')
          $j.PSObject.Properties.Remove('scripts')
          $j | ConvertTo-Json -Depth 100 | Set-Content $p -Encoding UTF8
          Write-Host "Removed $n devDependencies from the deploy copy"

          # 出厂门禁：data 里不许有 DB / 凭据
          $leaked = Get-ChildItem -Recurse -Path $dst -Include "*.db","*.db-*","ilink-credentials.json",".env*" -ErrorAction SilentlyContinue
          if ($leaked) {
            Write-Error "Refusing to package: credentials or database inside the bundle"
            $leaked | ForEach-Object { Write-Error $_.FullName }
            exit 1
          }
          Write-Host "Gate passed: no credentials or DB in the bundle"

      - name: Install production dependencies
        working-directory: packages/desktop/.deploy-server
        shell: pwsh
        run: |
          npm install --omit=dev --no-audit --no-fund
          # Electron 内置 Node 要跑 TS 入口，tsx 必须随包
          npm install --omit=dev --no-save --no-audit --no-fund tsx

      # ── ③ native 模块匹配 Electron ABI ──
      # better-sqlite3 是编译产物，装出来的默认是 Node ABI。Electron 的 ABI 不同，
      # 不 rebuild 会在 `require('better-sqlite3')` 直接崩 —— 表现为打开就白屏。
      - name: Rebuild better-sqlite3 for Electron
        shell: pwsh
        run: |
          $ver = (Get-Content "packages/desktop/package.json" -Raw | ConvertFrom-Json).devDependencies.electron
          $ver = $ver -replace '[\^~]', ''
          Write-Host "Electron $ver"
          # rebuild 工具装在**独立目录**，不能装进 .deploy-server ——
          # 否则 @electron/* 会留进产物，被第 ④ 步的卫生检查拦下（本地
          # build-dmg.sh 用的是 .build-tools/，这里照做）。
          $tools = "packages/desktop/.build-tools"
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Set-Content "$tools/package.json" '{"name":"supercrzy-build-tools","version":"0.0.0","private":true}'
          Push-Location $tools
          npm install --no-save --no-audit --no-fund "@electron/rebuild"
          Pop-Location

          # cwd 落在 .deploy-server 里跑 electron-rebuild（-m 参数语义有歧义，
          # 1.0.2 起就用默认值，见 build-dmg.sh 的说明）
          Push-Location packages/desktop/.deploy-server
          & "../.build-tools/node_modules/.bin/electron-rebuild.cmd" -f -w better-sqlite3 -v $ver
          $abi = "node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          if (-not (Test-Path $abi)) {
            Write-Error "better-sqlite3 native binary missing after rebuild"
            exit 1
          }
          Pop-Location
          Write-Host "better-sqlite3 rebuilt for Electron $ver"

      # ── ④ 修剪 peer 依赖死重 ──
      # openclaw 是 @tencent-weixin/openclaw-weixin 的 peerDependency，npm 7+ 自动装，
      # 白拉 342MB（App 体积的 37%）。全仓对它只有一处 import，见 build-dmg.sh 的说明。
      - name: Prune dead weight and assert package hygiene
        working-directory: packages/desktop/.deploy-server
        shell: pwsh
        run: |
          if (Test-Path "node_modules/openclaw") {
            Remove-Item -Recurse -Force "node_modules/openclaw"
            Write-Host "Pruned openclaw peer dependency"
          }
          Remove-Item -Force "node_modules/.bin/openclaw","node_modules/.bin/openclaw.cmd" -ErrorAction SilentlyContinue

          $bad = @()
          foreach ($p in @("openclaw","typescript","vite","vitest","rolldown","@rolldown","@electron")) {
            if (Test-Path "node_modules/$p") { $bad += $p }
          }
          if ($bad) {
            Write-Error "Refusing to package: unexpected content in node_modules -> $($bad -join ', ')"
            exit 1
          }
          Write-Host "Package hygiene OK"

      # ── ⑤ 出 nsis 安装包 ──
      # electron-builder 会从 GitHub 拉 nsis / winCodeSign / nsis-resources 等打包工具。
      # Actions runner 是共享出口 IP，实测会撞 429（Too Many Requests）。
      # Electron 二进制走 huaweicloud 镜像（与 electron-builder.yml 里 mac 的配置一致，
      # 那边实测 npmmirror 只有 11 KB/s，huaweicloud 313 KB/s）。
      # nsis 等工具没有官方镜像变量，靠重试兜住 —— 429 是瞬时的。
      - name: Build Windows installer
        working-directory: packages/desktop
        shell: pwsh
        env:
          UPDATE_URL: https://updates.supercrzy.com/releases
          # 刻意**不设** ELECTRON_MIRROR。
          # 实测：huaweicloud 镜像在 Actions 的共享出口 IP 上返回 429（mac 本机单独 IP
          # 时能用，313 KB/s —— 环境不同，结论不能照搬）。
          # Electron 的 release 本来就在 GitHub 上，runner 拉自己的 release 走的是
          # 高速通道，比任何第三方镜像都稳。
          # 打包工具（nsis 等）同样从 GitHub 拉，靠下面的重试兜住瞬时 429。
        run: |
          $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"   # 没签名证书，别去发现
          $attempt = 0
          $ok = $false
          while ($attempt -lt 4 -and -not $ok) {
            $attempt++
            Write-Host "=== electron-builder attempt $attempt ==="
            # --config.electronDownload.mirror= 空字符串 ⇒ 覆盖 electron-builder.yml 里
            # 写死的 huaweicloud 镜像（那份配置是为本机打包写的，在 Actions 的共享出口 IP
            # 上会被 429 限流）。CLI 参数优先级高于配置文件，env 覆盖不了。
            # 留空 ⇒ 回落到 Electron 的官方 GitHub release，runner 访问走高速通道。
            pnpm exec electron-builder --win nsis --publish never --config.electronDownload.mirror=
            if ($LASTEXITCODE -eq 0) { $ok = $true }
            else {
              Write-Host "attempt $attempt failed (exit $LASTEXITCODE)"
              if ($attempt -lt 4) {
                Start-Sleep -Seconds (30 * [Math]::Pow(2, $attempt - 1))   # 30 / 60 / 120s 退避
              }
            }
          }
          if (-not $ok) { Write-Error "electron-builder failed after $attempt attempts"; exit 1 }

      # Inject blockMapSize into latest.yml: electron-builder writes the .blockmap file but
      # omits the field, and electron-updater skips differential downloads without it.
      - name: Annotate updater manifest with blockMapSize
        run: node scripts/inject-blockmap-size.mjs packages/desktop/dist

      - name: List artifacts
        working-directory: packages/desktop/dist
        shell: pwsh
        run: Get-ChildItem -File | Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

      - uses: actions/upload-artifact@v7
        with:
          name: supercrzy-bot-windows-${{ github.event.inputs.version || github.ref_name }}
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.exe.blockmap
            packages/desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 30
