name: Build Android

# Why CI: the Android SDK + JDK are ~600MB of one-off setup and GitHub's
# ubuntu-latest image already ships both, so an APK never depends on someone
# having a local toolchain (same reasoning as build-macos.yml).
#
# Scope: the WebView shell (P0). The on-device runtime (PRoot rootfs + Node) is
# added later by copying a payload into app/src/main/assets/ before the build.
#
# Deliberately avoids actions/setup-java: the image's default JDK is 17, which is
# what AGP 8.7 needs, and one less third-party action is one less thing to break.
# The assert step fails loudly if that ever stops being true.
#
# Signing: debug keystore unless a real one is wired in. A debug-signed release
# APK installs on a device but cannot be uploaded to a store.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Extra label for the artifact name (optional)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/build-android.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: apps/android

    steps:
      - uses: actions/checkout@v7

      - name: Check JDK
        run: |
          set -e
          java -version
          major=$(java -version 2>&1 | awk -F'"' '/version/ {print $2}' | cut -d. -f1)
          if [ "$major" != "17" ]; then
            echo "::error::AGP 8.7 requires JDK 17, runner default is $major"
            exit 1
          fi

      # Installs Gradle 8.11.1 and caches ~/.gradle between runs. No wrapper jar is
      # committed, so the build calls `gradle` directly; locally `brew install gradle`
      # gives the same command.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Ensure SDK packages
        run: |
          set -e
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" && "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" >/dev/null || true
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" 2>/dev/null || true

      # Build output is almost never visible to anyone without repo admin, so on
      # failure we surface the interesting lines as annotations — those are public
      # and show up in the run summary, which keeps CI debuggable without a token.
      # ---- runtime payload (proot + alpine rootfs + node + our server) ----

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build client and server
        run: |
          pnpm --filter @supercrzy/client build
          pnpm --filter @supercrzy/server build
        working-directory: .

      # The payload script reads prod-only node_modules from the desktop deploy
      # tree; CI reproduces that tree without electron-builder.
      - name: Install production node_modules
        id: npminstall
        shell: bash
        run: |
          set -o pipefail
          mkdir -p packages/desktop/.deploy-server
          cp packages/server/package.json packages/desktop/.deploy-server/
          cd packages/desktop/.deploy-server
          npm install --omit=dev --ignore-scripts --no-audit --no-fund --legacy-peer-deps 2>&1 | tee npm-install.log

      - name: Report npm install errors
        if: failure() && steps.npminstall.outcome == 'failure'
        shell: bash
        run: |
          grep -nE "npm error|ERR!" packages/desktop/.deploy-server/npm-install.log | head -15 | while IFS= read -r line; do echo "::error::$line"; done
          exit 1

      - name: Assemble mobile payload
        id: payload
        shell: bash
        run: |
          set -o pipefail
          node scripts/build-mobile-payload.mjs --no-verify 2>&1 | tee payload.log

      - name: Report payload errors
        if: failure() && steps.payload.outcome == 'failure'
        shell: bash
        run: |
          tail -25 payload.log | while IFS= read -r line; do echo "::error::$line"; done
          exit 1
        working-directory: .

      - name: Fetch proot
        id: proot
        shell: bash
        run: |
          set -o pipefail
          bash runtime/fetch-proot.sh 2>&1 | tee proot.log

      - name: Report proot errors
        if: failure() && steps.proot.outcome == 'failure'
        shell: bash
        run: |
          tail -25 proot.log | while IFS= read -r line; do echo "::error::$line"; done
          exit 1

      - name: Build rootfs
        id: rootfs
        shell: bash
        run: |
          set -o pipefail
          bash runtime/build-rootfs.sh 2>&1 | tee rootfs.log

      - name: Report rootfs errors
        if: failure() && steps.rootfs.outcome == 'failure'
        shell: bash
        run: |
          tail -25 rootfs.log | while IFS= read -r line; do echo "::error::$line"; done
          exit 1

      # ---- APK ----

      - name: Assemble debug APK
        id: debug
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee build-debug.log

      - name: Report debug build errors
        if: failure() && steps.debug.outcome == 'failure'
        shell: bash
        run: |
          set +e
          grep -nE "^(e: |w: )?.*(error:|FAILURE:|Caused by:|> Task .* FAILED|Unresolved reference|e: file)" build-debug.log \
            | grep -v "^Binary" | head -25 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          echo "--- last 40 lines ---"
          tail -40 build-debug.log || true
          exit 1

      - name: Assemble release APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build-release.log

      - name: List artifacts
        run: find app/build/outputs -name "*.apk" -o -name "*.aab" | sort

      # A rolling pre-release: artifact zips need a login and a manual unzip, while a
      # release asset is a direct link you can tap on the phone. Recreated each build
      # so the name stays stable and no history piles up.
      - name: Publish rolling pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest \
            --prerelease \
            --title "Android · rolling build ${GITHUB_RUN_NUMBER}" \
            --notes "Debug-signed build from ${GITHUB_SHA:0:7}. Install on a device to test the shell; not for distribution." \
            "app/build/outputs/apk/debug/app-debug.apk#app-debug.apk" \
            "app/build/outputs/apk/release/app-release.apk#app-release.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: supercrzy-bot-android-${{ github.run_number }}${{ github.event.inputs.version && format('-{0}', github.event.inputs.version) || '' }}
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
