name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Lint + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (type checks)
        run: pnpm lint

      - name: Test (unit + API integration)
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # build 阶段避免网络请求；DEEPSEEK_API_KEY 留空即可（构建不依赖它）
          DEEPSEEK_API_KEY: ''
