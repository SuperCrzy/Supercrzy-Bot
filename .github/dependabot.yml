# Dependabot — https://docs.github.com/code-security/dependabot
#
# Weekly, grouped, capped. The goal is a readable stream of PRs, not a pile:
# patch/minor bumps arrive as a single grouped PR per ecosystem, and majors are
# left to a human because they usually need code changes (see the ignore list).
#
# 🔴 2026-10-19 修：此前 `groups` 只对 minor/patch 分组，**major 仍会各自单独开 PR**，
#    5 天攒了 7 个（vite 6→8、electron 33→44、vue-i18n 10→11 …），
#    对外呈现为「7 Open Issues / 7 Open PRs」，访客据此判断"无人维护"。
#
# 🔴 同日第二次修正（更根本）：npm 生态的 version updates **全部停用**（limit: 0）。
#    原因不是"没人管"，而是**这些 PR 从来没通过过 CI**：
#        CI 用 `pnpm install --frozen-lockfile`，
#        而 dependabot 对 pnpm workspace 只改 package.json、**不更新 pnpm-lock.yaml**
#        ⇒ frozen-lockfile 检测不一致 → 每个 PR 的 CI 必红。
#    也就是说自动化在本仓库配置下无法产出可合并的 PR，留着只会持续制造红叉。
#    改用 limit: 0（官方支持的"关闭 version updates"方式）：
#      · version updates 不再提 PR
#      · **security updates 不受影响**（走 repo settings 独立开关，照常提安全补丁并可自动合并）
#      · github-actions 生态保留（实测 CI 通过，见 #23）
#    需要主动升依赖时：本地 `pnpm update <pkg>` → 一并提交 package.json + pnpm-lock.yaml。

version: 2
updates:
  # --- Root workspace (pnpm) ---
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    groups:
      root-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Node runtime is pinned to 22.x; majors are handled deliberately, not automatically.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Electron majors require an electron-rebuild of better-sqlite3 and a
      # re-verification of the packaged App (see CONTRIBUTING).
      - dependency-name: electron
        update-types: ["version-update:semver-major"]
      - dependency-name: electron-builder
        update-types: ["version-update:semver-major"]

  # --- Individual packages (own version ranges) ---
  - package-ecosystem: npm
    directory: /packages/client
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps-client)"
    groups:
      client-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /packages/server
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps-server)"
    groups:
      server-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # 统一策略：major 一律人工（见文件头说明）。
      # better-sqlite3 另需匹配 Electron ABI，打包前要 electron-rebuild，同样不自动升。
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /packages/desktop
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps-desktop)"
    groups:
      desktop-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # 🔴 electron major 必须人工：需 electron-rebuild better-sqlite3 并重新验收打包产物。
      # 此前该规则只写在根目录，/packages/desktop 没有，导致 electron 33→44 被提成 PR。
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # --- GitHub Actions ---
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
