name: Feature request
description: Suggest a capability, improvement, or new integration
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening: check `CHANGELOG.md` and existing issues — it may already be planned.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the need, not the implementation. Concrete situations beat abstract wishes.
      placeholder: |
        e.g. When I run the agent on a long task I can't tell which files it changed
        without scrolling the whole timeline.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution (optional)
      description: If you have a specific design in mind, describe it here.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Client (Vue UI)
        - Server (Koa API)
        - Desktop (Electron)
        - Agent loop / tools
        - Skills
        - Model / provider support
        - Messaging gateway
        - TTS / read-aloud
        - Docs
        - Other

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to work on this myself (a PR would be welcome).
          required: false
